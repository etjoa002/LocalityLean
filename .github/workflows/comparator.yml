# Runs on GitHub's Linux machines at every change: builds the library and judges it with
# `lake comparator` inside its sandbox, with Lean's kernel and the four independent checkers.
# What it fetches: GitHub's own checkout step (pinned to a commit), Lean's official installer
# (elan, from github.com/leanprover/elan), the Lean version named in `lean-toolchain`, and the
# precompiled Mathlib named in `lake-manifest.json`; the sandbox tool bubblewrap from Ubuntu.
name: Comparator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free disk space and add swap (the independent checkers need more memory than the machine has)
        run: |
          df -h / /mnt; free -h
          # remove large preinstalled toolchains this job does not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
          # swap of at most 12 GB, leaving at least 20 GB free for Mathlib and the build
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          size=$(( avail - 20 )); if [ "$size" -gt 12 ]; then size=12; fi
          if [ "$size" -ge 2 ]; then
            sudo swapoff -a || true
            sudo fallocate -l "${size}G" /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          df -h /; free -h

      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # While the sibling libraries it depends on are private, a read-only token stored as the
      # secret DEPS_TOKEN lets this step download them. It is given to this step only, never to
      # the steps that compile the library. Without the secret (public dependencies) it is skipped.
      - name: Fetch the dependencies and the precompiled Mathlib
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${DEPS_TOKEN}@github.com/etjoa002/.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/etjoa002/"
          fi
          lake exe cache get

      - name: Build the library and the statement files
        run: lake build LocalityLean Challenge Solution

      - name: Check that the two statement files and the page agree
        run: |
          python3 verify/check_same_statements.py
          python3 verify/make_core_page.py --check

      - name: Install the sandbox (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Judge with lake comparator (sandboxed, all checkers)
        run: lake comparator --config verify/comparator.json --paranoid
